        body {
            background-color: #0b0f19 !important;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-container {
            width: 100%;
            max-width: 440px;
            background: #131b2e;
            border: 2px solid #2a3b5c;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
            z-index: 10;
        }

        /* Animated AI Bot Wall Screen Display */
        .bot-wall-screen {
            width: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #2a3b5c;
            position: relative;
        }

        .fuzz-avatar {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #f59e0b 60%, #b45309 100%);
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
            border: 3px solid #fde68a;
            position: relative;
            animation: floatAvatar 4s ease-in-out infinite;
        }

        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .bot-eyes {
            display: flex;
            gap: 8px;
        }

        .eye {
            width: 12px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            position: relative;
        }

        .pupil {
            width: 6px;
            height: 7px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .mood-badge {
            font-size: 14px;
            font-weight: bold;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        /* Header & Prices */
        .mt5-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1e293b;
            border-bottom: 1px solid #2a3b5c;
        }

        .symbol-info h1 {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
        }

        .symbol-info span {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .candle-countdown {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            font-family: monospace;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .ticker-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
            background: #0f172a;
            border-bottom: 1px solid #2a3b5c;
        }

        .price-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #2a3b5c;
        }

        .price-box.sell { border-top: 3px solid #ef4444; }
        .price-box.buy { border-top: 3px solid #10b981; }

        .price-box .label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
        }

        .price-box .value {
            font-size: 18px;
            font-weight: 800;
            font-family: monospace;
            margin-top: 4px;
            color: #fff;
        }

        /* Scanner Core */
        .scanner-section {
            padding: 16px;
        }

        .status-banner {
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
            font-weight: 700;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .status-idle { background: #1e293b; color: #94a3b8; border: 1px solid #2a3b5c; }
