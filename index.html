<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePilot AI - XAUUSD Institutional Sniper</title>
    <style>
        :root {
            --bg-color: #05070b;
            --panel-bg: rgba(14, 18, 26, 0.94);
            --border-color: #222836;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-buy: #10b981;
            --accent-sell: #ef4444;
            --accent-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Full Screen Wall Screen Animated Fuzz Bot Background with Emoji Badge */
        .wall-screen-bot {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(255, 159, 10, 0.2) 0%, rgba(5, 7, 11, 0) 70%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .fuzz-core {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ff9f0a 60%, #d97706 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 60px rgba(255, 159, 10, 0.35);
            border: 4px solid #fed7aa;
            animation: wallFloat 5s ease-in-out infinite;
        }

        @keyframes wallFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.04); }
        }

        .wall-eyes-container {
            display: flex;
            gap: 14px;
            position: relative;
            top: -4px;
        }

        .wall-eye {
            width: 28px;
            height: 36px;
            background: #ffffff;
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.6);
        }

        .wall-pupil {
            width: 14px;
            height: 16px;
            background: #000000;
            border-radius: 50%;
            position: absolute;
            bottom: 6px;
            right: 4px;
            animation: wallLook 4s infinite ease-in-out;
        }

        @keyframes wallLook {
            0%, 100% { transform: translate(0, 0); }
            30% { transform: translate(-3px, 2px); }
            70% { transform: translate(3px, -2px); }
        }
